name: CI PDVStore.Web

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PDVStore.Web.sln
      - run: dotnet build PDVStore.Web.sln --no-restore -c Release
      - run: dotnet test tests/PDVStore.Api.Tests/PDVStore.Api.Tests.csproj --no-build -c Release

  frontend:
    name: Frontend (React + TS)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
